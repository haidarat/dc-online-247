<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DC Online 24/7 Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --glass-glow: rgba(99, 102, 241, 0.15);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --online: #10b981;
      --online-glow: rgba(16, 185, 129, 0.4);
      --offline: #ef4444;
      --offline-glow: rgba(239, 68, 68, 0.4);
      --accent: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Dynamic Background Gradients */
    .bg-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      opacity: 0.3;
      filter: blur(80px);
      z-index: 0;
      animation: float 10s infinite alternate ease-in-out;
    }
    .bg-glow-2 {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #ec4899 0%, transparent 70%);
      bottom: -100px;
      right: -100px;
      opacity: 0.25;
      filter: blur(90px);
      z-index: 0;
      animation: float 12s infinite alternate-reverse ease-in-out;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 50px) scale(1.1); }
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 36px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      z-index: 1;
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .title-group h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 30%, var(--text-sub));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* Status Badge Top */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 0.9rem;
      backdrop-filter: blur(10px);
      border: 1px solid transparent;
      transition: all 0.4s ease;
    }

    .status-badge.online {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.3);
      color: var(--online);
      box-shadow: 0 0 20px var(--online-glow);
    }

    .status-badge.offline {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: var(--offline);
      box-shadow: 0 0 20px var(--offline-glow);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      position: relative;
    }
    .status-badge.online .status-dot {
      background: var(--online);
      box-shadow: 0 0 10px var(--online);
      animation: pulse 2s infinite;
    }
    .status-badge.offline .status-dot {
      background: var(--offline);
      box-shadow: 0 0 10px var(--offline);
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 var(--online-glow); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 20px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .card-full {
      grid-column: span 2;
    }

    .card-label {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 1.3rem;
      font-weight: 600;
      color: #fff;
      word-break: break-all;
    }

    .uptime-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #a855f7;
      font-variant-numeric: tabular-nums;
    }

    .progress-bar {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ec4899);
      width: 0%;
      border-radius: 99px;
      transition: width 0.5s ease;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.3);
    }

    @media (max-width: 500px) {
      .grid { grid-template-columns: 1fr; }
      .card-full { grid-column: span 1; }
      .container { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>

  <div class="container">
    <div class="header">
      <div class="title-group">
        <h1>DC Online 24/7</h1>
        <p id="botUser">Loading bot status...</p>
      </div>
      <div id="statusBadge" class="status-badge offline">
        <div class="status-dot"></div>
        <span id="statusText">CONNECTING</span>
      </div>
    </div>

    <div class="grid">
      <!-- 1. Server Name -->
      <div class="card">
        <div class="card-label">Server (Guild)</div>
        <div class="card-value" id="serverName">--</div>
      </div>

      <!-- 2. Voice Channel Name -->
      <div class="card">
        <div class="card-label">Voice Channel</div>
        <div class="card-value" id="channelName">--</div>
      </div>

      <!-- 3. CPU Usage -->
      <div class="card">
        <div class="card-label" id="cpuModelLabel">CPU Usage</div>
        <div class="card-value"><span id="cpuVal">0</span>%</div>
        <div class="progress-bar">
          <div class="progress-fill" id="cpuBar"></div>
        </div>
      </div>

      <!-- 4. RAM Usage -->
      <div class="card">
        <div class="card-label">RAM Usage (Heap / System)</div>
        <div class="card-value"><span id="ramProcVal">0</span> MB</div>
        <div class="progress-bar">
          <div class="progress-fill" id="ramBar"></div>
        </div>
      </div>

      <!-- 5. Uptime Real-time Timer -->
      <div class="card card-full">
        <div class="card-label">System Uptime</div>
        <div class="uptime-value" id="uptimeVal">0d 0h 0m 0s</div>
      </div>
    </div>

    <div class="footer">
      Real-time Hyper-Glassmorphism Dashboard • Updates metrics every 1 sec
    </div>
  </div>

  <script>
    function formatUptime(totalSeconds) {
      const d = Math.floor(totalSeconds / 86400);
      const h = Math.floor((totalSeconds % 86400) / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = Math.floor(totalSeconds % 60);
      return `${d}d ${h}h ${m}m ${s}s`;
    }

    async function fetchStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();

        // Selective DOM Updates (Partial Update - 1s Interval)
        const badge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        if (data.online) {
          if (statusText.innerText !== 'ONLINE') {
            badge.className = 'status-badge online';
            statusText.innerText = 'ONLINE';
          }
        } else {
          if (statusText.innerText !== 'OFFLINE') {
            badge.className = 'status-badge offline';
            statusText.innerText = 'OFFLINE';
          }
        }

        const botUserEl = document.getElementById('botUser');
        if (botUserEl.innerText !== data.botUser) botUserEl.innerText = data.botUser;

        const serverNameEl = document.getElementById('serverName');
        if (serverNameEl.innerText !== data.serverName) serverNameEl.innerText = data.serverName;

        const channelNameEl = document.getElementById('channelName');
        if (channelNameEl.innerText !== data.channelName) channelNameEl.innerText = data.channelName;

        // 3. CPU
        const cpuModelEl = document.getElementById('cpuModelLabel');
        if (data.cpuModel) {
          cpuModelEl.innerText = `CPU Usage — ${data.cpuModel}`;
        }
        document.getElementById('cpuVal').innerText = data.cpu;
        document.getElementById('cpuBar').style.width = Math.min(data.cpu, 100) + '%';

        document.getElementById('ramProcVal').innerText = `${data.ramProcess} MB (${data.ramSystem}% Sys)`;
        document.getElementById('ramBar').style.width = Math.min(data.ramSystem, 100) + '%';

        document.getElementById('uptimeVal').innerText = formatUptime(data.uptime);

      } catch (err) {
        console.error("Failed to fetch stats:", err);
      }
    }

    // Initial fetch and auto-refresh metrics every 1 second
    fetchStats();
    setInterval(fetchStats, 1000);
  </script>
</body>
</html>
